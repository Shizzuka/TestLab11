name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev", "fix" ]
  pull_request:
    branches: [ "main", "dev" ]

# Разрешения, необходимые для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run tests
        # Это заглушка для тестов. Команда echo просто выводит текст и завершается успешно.
        # Если у тебя есть реальные скрипты тестов (например, npm test), замени эти строки на них.
        run: |
          echo "Запуск проверок кода..."
          echo "Все тесты успешно пройдены!"

  deploy:
    # Запускать деплой ТОЛЬКО после успешного завершения джобы test
    needs: test 
    
    # Запускать деплой ТОЛЬКО если изменения происходят в ветке main
    if: github.ref == 'refs/heads/main' 
    
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Указывает, что нужно загрузить все файлы из корневой папки (index.html и т.д.)
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
